# Automated PyPI release via Trusted Publishing (OIDC — no API token).
#
# Setup (one time):
#   1. On PyPI, register this workflow as a trusted publisher for the
#      `agent-casuality` project. Owner, repository, workflow filename
#      (`workflow.yml`) and environment (`pypi`) must match this file.
#   2. In the GitHub repo settings, create an environment named `pypi`
#      (add required reviewers if you want a manual approval gate).
#
# Releasing:
#   1. Bump `version` in pyproject.toml (and README/CHANGELOG to match).
#   2. Commit, push, then create a GitHub Release with tag `v<version>`
#      (e.g. `v0.1.2`). Publishing starts automatically when the
#      release is published. `workflow_dispatch` is available for
#      manual re-runs only.
name: Release to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Verify, test, and build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Guard — release tag matches pyproject version
        if: github.event_name == 'release'
        run: |
          TAG="${TAG_NAME#v}"
          PKG=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag ($TAG) != pyproject version ($PKG); refusing to publish"
            exit 1
          fi
          echo "version OK: $PKG"
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Run unit tests
        run: uv run pytest -q

      - name: Run Ruff
        run: uv run ruff check .

      - name: Build distributions
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [verify-and-build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
